[build]
  command = "yarn build"
  functions = "functions"
  publish = "dist/"

[[redirects]]
  from = '/api/*'
  status = 200
  to = '/.netlify/functions/:splat'
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "functions/"

[dev]
  targetPort = 3000
  functionsPort = 8888
  autoLaunch = false

  # HTTPS certs (net-fn.pem, net-fn-key.pem) are gitignored for security.
  # Uncomment below and generate certs locally if you need HTTPS for dev.
  # [dev.https]
  #   certFile = "net-fn.pem"
  #   keyFile = "net-fn-key.pem"
