[build]
  command = "pnpm build"
  publish = "dist/client"

# SPA client-side routing: serve shell for all non-asset routes so direct navigation/bookmarks work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm dev"
  targetPort = 3000
  autoLaunch = false

  [dev.https]
    certFile = "./certs/net-fn.pem"
    keyFile = "./certs/net-fn-key.pem"
