[build]
  command = "yarn build"
  functions = "functions"
  publish = "dist/"

[[redirects]]
  from = '/api/*'
  status = 200
  to = '/.netlify/functions-serve/functions/:splat'
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "functions/"

[dev]
  targetPort = 3000
  functionsPort = 8888
  autoLaunch = false

  [dev.https]
    certFile = "./certs/net-fn.pem"
    keyFile = "./certs/net-fn-key.pem"
